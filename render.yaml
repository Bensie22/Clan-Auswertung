services:
  - type: web
    name: clan-gpt-api
    runtime: python
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port 10000
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - "*.py"
        - app/**
        - requirements.txt
      ignoredPaths:
        - member_memory.json
        - player_stats.json
        - player_war_decks.json
        - top_decks.json
        - warlog_cache.json
        - dashboard_data.json
        - commander_output.json
        - coaching_output.json
        - full_auto_output.json
        - smart_output.json
        - donations_memory.json
        - index.html
    envVars:
      - key: SUPERCELL_API_TOKEN
        sync: false
      - key: CR_API_KEY
        sync: false
      - key: CLAN_API_KEY
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_RECEIVER
        sync: false
      - key: IMPRESSUM_SITE_NAME
        sync: false
      - key: IMPRESSUM_OWNER_NAME
        sync: false
      - key: IMPRESSUM_STREET
        sync: false
      - key: IMPRESSUM_CITY
        sync: false
      - key: IMPRESSUM_PHONE
        sync: false
      - key: IMPRESSUM_EMAIL
        sync: false
      - key: IMPRESSUM_WEBSITE_URL
        sync: false
      - key: IMPRESSUM_RESPONSIBLE_NAME
        sync: false
      - key: IMPRESSUM_RESPONSIBLE_STREET
        sync: false
      - key: IMPRESSUM_RESPONSIBLE_CITY
        sync: false
