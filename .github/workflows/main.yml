name: Clan Auswertung Automatisierung

on:
  # Zwei Auslöser, ein Workflow – unterschieden allein über RUN_MODE (siehe env unten).
  #
  # 1) Datensammeln: cron-job.org ruft alle 10 Minuten die Dispatch-API auf.
  #    Ohne mitgeschickten Input greift der Default `radar`; der bisherige Lauf
  #    bleibt damit unverändert.
  # 2) Wochenauswertung: der schedule-Block darunter.
  #
  # Den Input gibt es zusätzlich, damit sich der Wochenlauf von Hand starten lässt
  # (Actions → Run workflow → run_mode: weekly), ohne bis Montag zu warten.
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'radar = nur Daten sammeln | weekly = Wochenauswertung (Verwarnungen, Score-Historie, Mail)'
        type: choice
        options:
          - radar
          - weekly
        default: radar

  schedule:
    # Montag 12:00 UTC = 14:00 Berlin (Sommerzeit) bzw. 13:00 (Winterzeit).
    # Bewusst am frühen Nachmittag und nicht früher:
    #   - Das Flussrennen endet montags um 10:00 UTC (siehe is_clan_war_period).
    #   - prefetch_warlog.py frischt den Warlog-Cache erst ab Montag 12:00
    #     Europe/Berlin auf. Ein Lauf davor würde den gerade beendeten Krieg
    #     noch nicht sehen und auf veralteten Daten bewerten.
    # 12:00 UTC liegt in beiden Zeitzonen-Varianten sicher hinter beiden Grenzen.
    - cron: '0 12 * * 1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  run-auswertung:
    runs-on: ubuntu-latest

    env:
      SUPERCELL_API_TOKEN: ${{ secrets.SUPERCELL_API_TOKEN }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      IMPRESSUM_SITE_NAME: ${{ secrets.IMPRESSUM_SITE_NAME }}
      IMPRESSUM_OWNER_NAME: ${{ secrets.IMPRESSUM_OWNER_NAME }}
      IMPRESSUM_STREET: ${{ secrets.IMPRESSUM_STREET }}
      IMPRESSUM_CITY: ${{ secrets.IMPRESSUM_CITY }}
      IMPRESSUM_PHONE: ${{ secrets.IMPRESSUM_PHONE }}
      IMPRESSUM_EMAIL: ${{ secrets.IMPRESSUM_EMAIL }}
      IMPRESSUM_WEBSITE_URL: ${{ secrets.IMPRESSUM_WEBSITE_URL }}
      IMPRESSUM_RESPONSIBLE_NAME: ${{ secrets.IMPRESSUM_RESPONSIBLE_NAME }}
      IMPRESSUM_RESPONSIBLE_STREET: ${{ secrets.IMPRESSUM_RESPONSIBLE_STREET }}
      IMPRESSUM_RESPONSIBLE_CITY: ${{ secrets.IMPRESSUM_RESPONSIBLE_CITY }}
      CLAN_API_KEY: ${{ secrets.CLAN_API_KEY }}
      # Passwort fuer den verschluesselten Leitungs-Bereich in index.html.
      # Fehlt das Secret, laesst der Generator den Bereich komplett weg –
      # er wird NIE unverschluesselt ausgeliefert.
      ADMIN_PASSPHRASE: ${{ secrets.ADMIN_PASSPHRASE }}
      # Der schedule-Lauf ist der Wochenlauf, jeder andere Auslöser sammelt nur Daten.
      # Der manuelle Dispatch darf beides – über den Input oben.
      # Bei einem Dispatch ohne Input ist der Wert leer, dann greift 'radar'.
      # Absichtlich github.event.inputs statt inputs: Der inputs-Kontext existiert
      # laut Doku nur bei workflow_dispatch/workflow_call, github.event gibt es
      # dagegen bei jedem Auslöser – so kann der schedule-Lauf nicht daran scheitern.
      RUN_MODE: ${{ github.event_name == 'schedule' && 'weekly' || github.event.inputs.run_mode || 'radar' }}

    steps:
      - name: Laufmodus protokollieren
        run: echo "RUN_MODE=$RUN_MODE (Auslöser ${{ github.event_name }})"

      - name: Repository klonen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dotenv

      - name: Warlog Cache aktualisieren (nur wenn seit letztem Montag 12 Uhr nicht erfolgt)
        run: python prefetch_warlog.py

      - name: Auswertung starten
        run: python Master_Auswertung_GitHub.py

      - name: API-Daten einmalig abrufen
        run: python prefetch.py

      - name: Full Auto starten
        run: python full_auto.py

      - name: Smart Mode starten
        run: python smart_mode.py

      - name: Coaching Mode starten
        run: python coaching_mode.py

      - name: Commander Mode starten
        run: python commander_mode.py

      - name: Outputs zusammenführen
        run: python merge_outputs.py

      - name: Commit und Push der neuen Dateien
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add .
          # Eigene Nachricht für den Wochenlauf: In der Historie ist damit auf einen
          # Blick zu sehen, ob er tatsächlich gelaufen ist. Genau das war zuletzt
          # monatelang nicht erkennbar, weil alle Commits gleich hießen.
          if [ "$RUN_MODE" = "weekly" ]; then
            MSG="🗓️ Wochenauswertung (Verwarnungen + Score-Historie)"
          else
            MSG="📊 Automatische Clan-Auswertung + Full Auto"
          fi
          git diff --staged --quiet || git commit -m "$MSG"
          git push